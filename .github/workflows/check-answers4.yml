name: Check Question 4

on:
  push:
    paths:
      - 'questions/question4.txt'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check answer
        run: |
          answer=$(grep "Answer:" questions/question4.txt | sed 's/Answer://' | tr '[:upper:]' '[:lower:]' | xargs)

          if [ "$answer" = "keyboard" ]; then
            echo "Question 4 correct!"
          else
            echo "Question 4 incorrect!"
            exit 1
          fi
