name: Check Question 1

on:
  push:
    paths:
      - 'questions/question1.txt'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check answer
        run: |
          answer=$(grep "Answer:" questions/question1.txt | sed 's/Answer://' | tr '[:upper:]' '[:lower:]' | xargs)

          if [ "$answer" = "mouse" ]; then
            echo "Question 1 correct!"
          else
            echo "Question 1 incorrect!"
            exit 1
          fi
