name: Check Question 3

on:
  push:
    paths:
      - 'questions/question3.txt'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check answer
        run: |
          answer=$(grep "Answer:" questions/question3.txt | sed 's/Answer://' | tr '[:upper:]' '[:lower:]' | xargs)

          if [ "$answer" = "gummy bear" ]; then
            echo "Question 3 correct!"
          else
            echo "Question 3 incorrect!"
            exit 1
          fi
